<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Paginación de Memoria - Colegio Mayor del Cauca</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwindConfig.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes memoryPulse {
          0%, 100% { border-color: #F5BE0B; box-shadow: 0 0 10px rgba(245,190,11,.4); }
          50% { border-color: #D9A107; box-shadow: 0 0 20px rgba(245,190,11,.8); }
        }
        .pulse-selected { animation: memoryPulse 1.8s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,.05); }
        .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,.05); }
        ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100,116,139,.6); }
        [data-detail-slide] { animation: detailSlideIn .22s ease-out; }
        @keyframes detailSlideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>

<body class="bg-gray-100 dark:bg-slate-950 text-gray-800 dark:text-slate-100 font-sans transition-colors duration-300 min-h-full flex flex-col">
<div id="toastContainer" class="fixed top-5 right-5 z-[120] flex flex-col gap-2 pointer-events-none"></div>

<div id="header-root"></div>

<div class="flex flex-1 flex-col md:flex-row relative">
    <div id="sidebar-root"></div>
    <main class="flex-1 min-w-0 p-4 md:p-6 space-y-6 overflow-x-hidden">
        <div id="form-root"></div>
        <div id="results-panel-root"></div>
    </main>
</div>

<div id="footer-root"></div>

<script src="js/loader.js"></script>
</body>
</html>
