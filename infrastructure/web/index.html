<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Paginación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E3A8A', // Azul oscuro para textos y sidebar activo
                        secondary: '#FFC107', // Amarillo para el header y botones
                        background: '#F3F4F6' // Fondo gris claro
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-background font-sans text-gray-800 min-h-screen flex flex-col">

    <!-- Header (Basado en la imagen de referencia) -->
    <header class="bg-secondary text-primary shadow-md">
        <div class="px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🚀</span>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Simulador de Paginación de Memoria</h1>
                    <span class="text-xs font-semibold tracking-wider">ARQUITECTURA DE COMPUTADORES</span>
                </div>
            </div>
            <!-- Logo Institucional -->
            <div class="w-12 h-12 bg-white rounded border border-primary flex items-center justify-center text-xs font-bold text-primary">
                LOGO
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar (Módulos) -->
        <aside class="w-64 bg-white shadow-lg border-r border-gray-200 z-10 flex flex-col">
            <div class="p-4 border-b border-gray-100">
                <span class="text-xs font-bold text-gray-400 tracking-wider">MÓDULOS</span>
            </div>
            <nav class="flex-1 p-4 space-y-2" id="sidebarNav">
                <button data-target="module-pages" class="w-full text-left px-4 py-3 rounded-lg bg-primary text-white font-semibold transition-colors flex items-center">
                    <span class="mr-2">⇄</span> 1. Calcular Páginas
                </button>
                <button data-target="module-didactic" class="w-full text-left px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition-colors flex items-center">
                    <span class="mr-2">📝</span> 2. Rango Didáctico
                </button>
            </nav>
        </aside>

        <!-- Contenedor Principal -->
        <main class="flex-1 p-8 overflow-y-auto">

            <!-- Vista: Calcular Número de Páginas (/pages-from-bus) -->
            <section id="module-pages" class="module-view active">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-xl font-bold text-primary mb-6 flex items-center border-b pb-3">
                        <span class="text-secondary mr-2">📝</span> [Bus] + [Anchura Página] → Calcular Páginas
                    </h2>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <form id="formPagesFromBus" class="col-span-1 space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Ancho del Bus (bits)</label>
                                <input type="number" id="pb-bus" value="16" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-1">Tamaño de Página (KB)</label>
                                <input type="number" id="pb-size" value="4" step="0.1" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-transparent">
                            </div>
                            <button type="submit" class="w-full bg-secondary text-primary font-bold py-3 px-4 rounded-lg hover:bg-yellow-500 transition duration-300">
                                Calcular Páginas →
                            </button>
                        </form>

                        <div class="col-span-1 lg:col-span-2 bg-gray-50 rounded-lg p-6 border border-gray-200 flex flex-col items-center justify-center" id="result-pages">
                            <span class="text-gray-400">Esperando parámetros...</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Vista: Rango Didáctico (/range-didactic) -->
            <section id="module-didactic" class="module-view hidden">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-xl font-bold text-primary mb-6 flex items-center border-b pb-3">
                        <span class="text-secondary mr-2">📝</span> Análisis Didáctico de Rango
                    </h2>

                    <form id="formRangeDidactic" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Bus (bits)</label>
                            <input type="number" id="rd-bus" value="16" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Pág. Size (KB)</label>
                            <input type="number" id="rd-size" value="4" step="0.1" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Pág. Inicial</label>
                            <input type="number" id="rd-start" value="0" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Pág. Final</label>
                            <input type="number" id="rd-end" value="5" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary">
                        </div>
                        <div class="md:col-span-4">
                            <button type="submit" class="w-full bg-secondary text-primary font-bold py-3 px-4 rounded-lg hover:bg-yellow-500 transition duration-300">
                                Ejecutar Análisis →
                            </button>
                        </div>
                    </form>

                    <div id="result-didactic" class="space-y-6 hidden">
                        <!-- Componentes dinámicos (Pasos y Tabla) inyectados vía JS -->
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Scripts Modulares -->
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
