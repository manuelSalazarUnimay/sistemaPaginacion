<div class="flex flex-col xl:flex-row gap-6">
    <!-- Contenedor del Formulario -->
    <div class="converter-container rounded-lg shadow-sm border p-6 flex-1 relative">
        <div class="flex items-center gap-2 mb-6">
            <svg class="w-6 h-6 text-brandYellow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
            </svg>
            <h2 id="formTitle" class="text-xl font-bold text-brandBlue">Calcular Páginas</h2>
        </div>

        <form id="calcForm" class="space-y-4">
            <input type="hidden" id="currentMode" value="pages-from-bus">

            <!-- Fila 1 de inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="input-group bus-group">
                    <label class="block text-sm font-medium text-gray-700">Bits del Bus</label>
                    <input type="number" id="busBits" min="1" max="128"
                           class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-brandBlue focus:border-brandBlue"
                           placeholder="Ej: 16">
                </div>

                <div class="input-group size-group">
                    <label class="block text-sm font-medium text-gray-700">Tamaño de Página (KB)</label>
                    <input type="number" step="0.1" id="pageSizeKb"
                           class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-brandBlue focus:border-brandBlue"
                           placeholder="Ej: 1.0">
                </div>

                <div class="input-group pages-group hidden">
                    <label class="block text-sm font-medium text-gray-700">Total de Páginas</label>
                    <input type="number" id="totalPages"
                           class="mt-1 w-full border border-gray-300 rounded-md p-3 focus:ring-brandBlue focus:border-brandBlue"
                           placeholder="Ej: 1024">
                </div>
            </div>

            <!-- Previsualización Didáctica de Potencias (Solo modo didáctico) -->
            <div id="powerPreviewContainer"
                 class="hidden p-4 bg-gray-50 border rounded-md my-4 flex justify-center gap-2 flex-wrap">
                <!-- Se llenará dinámicamente -->
            </div>

            <!-- Fila 2 de inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div class="input-group optional-group">
                    <label class="block text-sm font-medium text-gray-500">Página Específica (Opcional)</label>
                    <input type="number" id="requestedPage" min="0"
                           class="mt-1 w-full border border-gray-300 rounded-md p-3" placeholder="Ej: 40">
                </div>

                <div class="input-group range-group hidden">
                    <label class="block text-sm font-medium text-gray-700">Página Inicial</label>
                    <input type="number" id="startPage" min="0"
                           class="mt-1 w-full border border-gray-300 rounded-md p-3" value="0">
                </div>
                <div class="input-group range-group hidden">
                    <label class="block text-sm font-medium text-gray-700">Página Final</label>
                    <input type="number" id="endPage" min="0" class="mt-1 w-full border border-gray-300 rounded-md p-3"
                           value="10">
                </div>
            </div>

            <div class="mt-8">
                <button type="submit"
                        class="btn-primary-action w-full py-3 rounded-md shadow-md text-lg flex items-center justify-center gap-2 bg-brandYellow hover:brightness-95 font-semibold text-gray-900 transition-all">
                    Ejecutar Simulación
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Contenedor de Errores Traducidos -->
        <div id="errorContainer"
             class="hidden mt-4 p-4 bg-red-50 text-red-700 rounded-md border border-red-200 text-sm space-y-1"></div>
    </div>

    <!-- Panel de Resultado Inmediato -->
    <div class="xl:w-1/3 flex flex-col">
        <div class="quick-result-card rounded-lg border bg-white p-6 flex flex-col h-full items-center justify-between relative min-h-[320px] shadow-sm">
            <span class="text-xs font-bold text-brandBlue uppercase tracking-widest mb-4">Resultado Inmediato</span>

            <!-- Contenido Inmediato Dinámico -->
            <div id="quickResultContent" class="text-center w-full my-auto">
                <div class="text-4xl text-brandBlue opacity-30 font-bold mb-4">---</div>
                <p class="text-sm text-gray-400">Esperando simulación...</p>
            </div>

            <!-- Botón de Desglose -->

            <button id="btnShowDetails"
                    type="button"
                    class="mt-4 w-full py-2.5 bg-white border border-gray-300 text-brandBlue font-semibold text-sm rounded-md hover:bg-gray-50 transition-colors hidden flex items-center justify-center gap-2">
                Desglose de este resultado
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
